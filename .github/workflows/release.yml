name: Build & Release (Installer + Portable)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (NSIS Installer + Portable ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Full NSIS Installer
        run: pnpm build:installer

      - name: Package Portable Edition ZIP
        run: node scripts/make-portable.mjs

      - name: Upload Full Installer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GrimoireMaker-Installer-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload Portable Edition artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GrimoireMaker-Portable-x64
          path: release/GrimoireMaker-portable-*-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            release/GrimoireMaker-portable-*-x64.zip
