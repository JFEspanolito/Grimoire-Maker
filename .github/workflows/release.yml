name: Build & Release (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (leave empty to build artifacts only)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A tag has one complete release producer, even if it is dispatched again.
concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build full NSIS installer
        if: runner.os == 'Windows'
        run: pnpm build:installer:signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package portable Windows edition
        if: runner.os == 'Windows'
        run: node scripts/make-portable.mjs

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: pnpm build:dmg:signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows installer artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe*
            src-tauri/target/release/bundle/nsis/*-setup.nsis.zip*
          if-no-files-found: error

      - name: Upload portable Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-windows-portable
          path: release/GrimoireMaker-portable-*-x64.zip
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-macos-packages
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish complete release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Download all completed build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release/bundles
          merge-multiple: true

      - name: Generate combined update manifest
        shell: bash
        run: |
          node scripts/generate-update-manifest.mjs --tag "$TAG" --bundle-dir release/bundles --out release/latest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { platforms } = JSON.parse(readFileSync('release/latest.json', 'utf8'))
          if (!platforms['windows-x86_64'] || !Object.keys(platforms).some(key => key.startsWith('darwin-'))) {
            throw new Error('Both Windows and macOS signed updater bundles are required before publishing')
          }
          NODE

      - name: Publish all artifacts and the combined manifest
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/bundles/**/*
            release/latest.json
